<form
  [formGroup]="formGroup"
  [bitSubmit]="submit"
  bit-simple-dialog
  [hideIcon]="simpleDialogOpts.hideIcon ?? false"
  [cream]="simpleDialogOpts.focusCancel ?? false"
>
  <i bitDialogIcon class="bwi tw-text-3xl" [class]="iconClasses" aria-hidden="true"></i>

  <span bitDialogTitle>{{ title }}</span>

  <div bitDialogContent>{{ content }}</div>

  <ng-container bitDialogFooter>
    @if (simpleDialogOpts.focusCancel && showCancelButton) {
      <button type="submit" bitButton bitFormButton buttonType="secondary" appAutofocus>
        {{ cancelButtonText }}
      </button>
    }
    <button
      [type]="simpleDialogOpts.focusCancel ? 'button' : 'submit'"
      bitButton
      bitFormButton
      [buttonType]="simpleDialogOpts.type === 'danger' ? 'danger' : 'primary'"
      (click)="simpleDialogOpts.focusCancel ? accept() : null"
    >
      {{ acceptButtonText }}
    </button>

    @if (showCancelButton && !simpleDialogOpts.focusCancel) {
      <button
        type="button"
        bitButton
        bitFormButton
        buttonType="secondary"
        (click)="dialogRef.close(false)"
      >
        {{ cancelButtonText }}
      </button>
    }
  </ng-container>
</form>
