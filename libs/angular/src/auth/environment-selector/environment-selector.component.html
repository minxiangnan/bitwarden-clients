<ng-container
  *ngIf="{
    selectedRegion: selectedRegion$ | async,
  } as data"
>
  <div class="tw-mb-1">
    <bit-menu #environmentOptions>
      <button
        *ngFor="let region of availableRegions$ | async; let i = index"
        bitMenuItem
        type="button"
        [attr.aria-pressed]="data.selectedRegion === region ? 'true' : 'false'"
        (click)="toggle(region.key)"
      >
        <bit-icon
          name="bwi-check"
          class="bwi-fw bwi-sm"
          style="padding-bottom: 1px"
          [style.visibility]="data.selectedRegion === region ? 'visible' : 'hidden'"
        ></bit-icon>
        <span>{{ region.domain }}</span>
      </button>
      <button
        bitMenuItem
        type="button"
        [attr.aria-pressed]="data.selectedRegion ? 'false' : 'true'"
        (click)="toggle(ServerEnvironmentType.SelfHosted)"
      >
        <bit-icon
          name="bwi-check"
          class="bwi-fw bwi-sm"
          style="padding-bottom: 1px"
          [style.visibility]="data.selectedRegion ? 'hidden' : 'visible'"
        ></bit-icon>
        <span>{{ "selfHostedServer" | i18n }}</span>
      </button>
    </bit-menu>
    <div bitTypography="body2">
      {{ "accessing" | i18n }}:
      <b class="tw-text-primary-600 tw-font-medium">{{
        data.selectedRegion?.domain || ("selfHostedServer" | i18n)
      }}</b>
    </div>
    @if (!data.selectedRegion) {
      <label class="tw-mt-2 tw-block tw-text-sm" for="private-server-url">{{
        "baseUrl" | i18n
      }}</label>
      <input
        id="private-server-url"
        class="tw-mt-1 tw-w-full tw-rounded-lg tw-border tw-border-solid tw-border-secondary-300 tw-bg-background tw-px-3 tw-py-2"
        type="url"
        [value]="baseUrl"
        (input)="baseUrl = $any($event.target).value"
        (blur)="saveBaseUrl()"
        placeholder="https://vault.example.com"
      />
      <button class="tw-mt-2 tw-text-sm tw-text-muted" type="button" (click)="showCloudRegions = !showCloudRegions">
        Bitwarden 云
      </button>
    }
    @if (data.selectedRegion || showCloudRegions) {
      <button [bitMenuTriggerFor]="environmentOptions" bitLink type="button">
        {{ "selfHostedServer" | i18n }}
        <bit-icon name="bwi-angle-down" class="bwi-fw bwi-sm"></bit-icon>
      </button>
    }
  </div>
</ng-container>
