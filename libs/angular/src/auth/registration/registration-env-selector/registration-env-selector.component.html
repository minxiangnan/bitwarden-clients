<form [formGroup]="formGroup" *ngIf="!hideEnvSelector">
  <bit-form-field>
    <bit-label>{{ "creatingAccountOn" | i18n }}</bit-label>
    <bit-select formControlName="selectedRegion" (closed)="onSelectClosed()">
      <bit-option
        *ngFor="let regionConfig of availableRegionConfigs$ | async"
        [value]="regionConfig"
        [label]="regionConfig.domain"
      ></bit-option>
      <bit-option
        *ngIf="isDesktopOrBrowserExtension"
        [value]="ServerEnvironmentType.SelfHosted"
        [label]="'selfHostedServer' | i18n"
      ></bit-option>
    </bit-select>
  </bit-form-field>
  <bit-form-field *ngIf="selectedRegion.value === ServerEnvironmentType.SelfHosted">
    <bit-label>{{ "baseUrl" | i18n }}</bit-label>
    <input
      id="register-self-hosted-url"
      bitInput
      type="url"
      [value]="baseUrl"
      (input)="baseUrl = $any($event.target).value"
      (blur)="saveBaseUrl()"
      placeholder="https://vault.example.com"
    />
  </bit-form-field>
</form>
