<popup-page>
  <popup-header slot="header" pageTitle="{{ 'about' | i18n }}" showBackButton>
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
    </ng-container>
  </popup-header>

  <div class="tw-mb-3 tw-px-1" data-testid="about-identity">
    <p class="tw-mb-0 tw-text-sm tw-font-semibold tw-text-main">
      {{ "authenticatorProductName" | i18n }}
    </p>
    <p class="tw-mb-0 tw-mt-0.5 tw-text-xs tw-text-muted">{{ releaseVersion }}</p>
    <p class="tw-mb-0 tw-mt-1 tw-text-xs tw-leading-4">
      <button
        type="button"
        class="tw-border-0 tw-bg-transparent tw-p-0 tw-text-xs tw-font-normal tw-text-primary-600 tw-underline disabled:tw-opacity-60"
        data-testid="about-recheck"
        [disabled]="checking()"
        (click)="checkForUpdate()"
      >
        {{ "authenticatorRecheck" | i18n }}
      </button>
      @if (checking()) {
        <span class="tw-ml-2 tw-text-muted">{{ "authenticatorCheckingUpdate" | i18n }}</span>
      } @else if (notice(); as current) {
        <span class="tw-ml-2 tw-text-primary-600">
          {{ "authenticatorNewVersion" | i18n }} {{ current.version }}
        </span>
      } @else if (checked() && !failed()) {
        <span class="tw-ml-2 tw-text-muted">{{ "authenticatorUpToDate" | i18n }}</span>
      }
    </p>
  </div>

  <bit-item-group>
    <bit-item>
      <button type="button" bit-item-content (click)="troubleshoot()">
        {{ "troubleshooting" | i18n }}
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content (click)="about()">
        {{ "aboutBitwarden" | i18n }}
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content (click)="launchHelp()">
        {{ "helpCenter" | i18n }}
        <i slot="end" class="bwi bwi-external-link" aria-hidden="true"></i>
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content (click)="openWebVault()">
        {{ "bitWebVaultApp" | i18n }}
        <i slot="end" class="bwi bwi-external-link" aria-hidden="true"></i>
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content (click)="rate()">
        {{ "rateExtension" | i18n }}
        <i slot="end" class="bwi bwi-external-link" aria-hidden="true"></i>
      </button>
    </bit-item>
  </bit-item-group>
</popup-page>
