<popup-page>
  <popup-header slot="header" [pageTitle]="'generator' | i18n">
    <ng-container slot="end">
      <app-pop-out />
      <app-current-account />
    </ng-container>
  </popup-header>
  <p class="tw-mb-2 tw-text-sm tw-text-muted">{{ "passwordPresetHint" | i18n }}</p>
  <div class="tw-mb-4 tw-flex tw-flex-wrap tw-gap-2">
    @for (preset of presets; track preset.id) {
      <button type="button" bitButton buttonType="secondary" size="small" (click)="usePreset(preset.id)">
        {{ preset.labelKey | i18n }}
      </button>
    }
  </div>
  <tools-credential-generator />
  <bit-item>
    <a type="button" bit-item-content routerLink="/generator-history">
      {{ "generatorHistory" | i18n }}
      <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
    </a>
  </bit-item>
</popup-page>
